# Reverse proxy nginx pour ask-ai.wenoble.fr
#
# Vérifier quel dossier la conf principale inclut :
#   grep -rE "include.*(sites-enabled|conf\.d)" /etc/nginx/nginx.conf
#
# Puis, selon le cas :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-enabled/ask-ai.wenoble.fr
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/ask-ai.wenoble.fr.conf   # doit finir par .conf
#
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ask-ai.wenoble.fr
#
# Certbot réécrira ce fichier pour y ajouter le bloc TLS et la redirection 80 → 443.

server {
    listen 80;
    listen [::]:80;
    server_name ask-ai.wenoble.fr;

    # Le cookie de session est marqué `Secure` en production : sans HTTPS, le
    # navigateur le refuserait et la conversation ne survivrait pas au refresh.
    # certbot s'occupe du certificat.

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Sans ces en-têtes, Fastify (trustProxy) verrait toutes les requêtes
        # venir de 127.0.0.1 : la limitation de débit compterait alors tous les
        # visiteurs comme un seul et même client.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Indispensable pour le streaming SSE de /chat ---
        # Par défaut nginx bufferise la réponse : le visiteur ne verrait rien
        # arriver, puis la réponse entière d'un coup. Le streaming serait perdu.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Une réponse de Claude peut prendre plusieurs dizaines de secondes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
