# Reverse proxy Apache pour ask-ai.wenoble.fr
#
# À utiliser À LA PLACE de nginx (deploy/nginx.conf) quand Apache occupe déjà les
# ports 80/443 sur le VPS. Les deux ne peuvent pas écouter le même port.
#
# Modules requis :
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl restart apache2
#
# Installation :
#   sudo cp deploy/apache.conf /etc/apache2/sites-available/ask-ai.wenoble.fr.conf
#   sudo a2ensite ask-ai.wenoble.fr
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d ask-ai.wenoble.fr
#
# certbot créera le vhost :443 et la redirection 80 → 443.
#
# Logs : sudo tail -f /var/log/apache2/ask-ai-error.log

<VirtualHost *:80>
    ServerName ask-ai.wenoble.fr

    # Le cookie de session est marqué `Secure` en production : sans HTTPS, le
    # navigateur le refuserait et la conversation ne survivrait pas au refresh.
    # certbot s'occupe du certificat.

    ProxyPreserveHost On
    ProxyRequests Off

    # --- Indispensable pour le streaming SSE de /chat ---
    #
    # Apache transmet la réponse au fil de l'eau, MAIS mod_deflate casserait
    # tout : en compressant le flux, il l'accumule dans un tampon et le visiteur
    # ne verrait rien arriver avant la fin. On désactive donc la compression et
    # tout cache sur ce vhost.
    SetEnv no-gzip 1
    SetEnv dont-vary 1
    RequestHeader unset Accept-Encoding

    # Une réponse de Claude peut prendre plusieurs dizaines de secondes.
    ProxyTimeout 300

    ProxyPass        / http://127.0.0.1:3001/ retry=0
    ProxyPassReverse / http://127.0.0.1:3001/

    # mod_proxy_http ajoute lui-même X-Forwarded-For : c'est ce que Fastify
    # (trustProxy) lit pour connaître l'IP réelle du visiteur. Sans elle, la
    # limitation de débit compterait tous les visiteurs comme un seul client,
    # puisqu'ils arriveraient tous de 127.0.0.1.
    #
    # X-Forwarded-Proto, en revanche, n'est PAS ajouté automatiquement : il faut
    # le poser à la main. certbot passera cette valeur à "https" dans le vhost
    # :443 qu'il génère.
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/ask-ai-error.log
    CustomLog ${APACHE_LOG_DIR}/ask-ai-access.log combined
</VirtualHost>
